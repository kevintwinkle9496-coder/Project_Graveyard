<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project Graveyard – Senior Projects for Juniors</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mu:#667085;--bd:#e3e6ee;--ac:#4f46e5;--ac2:#eef0ff;--ok:#12805c;--wn:#b45309;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141b;--card:#1b1e28;--tx:#eceef5;--mu:#98a0b3;--bd:#2c3040;--ac:#8b85ff;--ac2:#25274a;--ok:#4ade80;--wn:#fbbf24}}
:root[data-theme="dark"]{--bg:#12141b;--card:#1b1e28;--tx:#eceef5;--mu:#98a0b3;--bd:#2c3040;--ac:#8b85ff;--ac2:#25274a;--ok:#4ade80;--wn:#fbbf24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 18px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.logo{font-weight:800;font-size:18px;color:var(--ac)}nav{display:flex;gap:6px;flex-wrap:wrap}
button,select,input,textarea{font:inherit;color:var(--tx)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.o{background:transparent;color:var(--ac);border:1px solid var(--bd)}.btn.o.on{background:var(--ac2);border-color:var(--ac)}
.btn.s{padding:5px 10px;font-size:13px}main{max-width:1050px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
input,select,textarea{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;width:100%}
.bar input,.bar select{width:auto;flex:1 1 150px}
.tag{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:99px;padding:2px 9px;font-size:12px;margin:2px 3px 2px 0}
.mu{color:var(--mu);font-size:13px}.ok{color:var(--ok)}.wn{color:var(--wn)}
h2{margin:6px 0 14px}h3{margin:0 0 4px}
.who{display:flex;gap:8px;align-items:center;margin:10px 0;padding-top:10px;border-top:1px solid var(--bd)}
.av{width:34px;height:34px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}.stats .card{flex:1 1 140px;text-align:center}.stats b{font-size:24px;display:block;color:var(--ac)}
.auth{max-width:400px;margin:40px auto}.auth label{display:block;margin:10px 0 3px;font-size:13px;color:var(--mu)}
.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:16px;z-index:20}.modal .card{max-width:520px;width:100%;max-height:90vh;overflow:auto}
.ticket{border:2px dashed var(--ac);border-radius:12px;padding:16px;margin:10px 0;display:flex;gap:14px;align-items:center}
.code{font:700 18px ui-monospace,monospace;letter-spacing:2px;color:var(--ac)}
.qr{width:64px;height:64px;flex:none;display:grid;grid-template-columns:repeat(8,1fr);gap:1px}.qr i{background:var(--tx)}.qr i.z{background:transparent}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hov{transition:transform .15s,box-shadow .15s;cursor:pointer}.hov:hover{transform:translateY(-3px);box-shadow:0 8px 20px #0002}
.rip{position:fixed;right:18px;bottom:calc(30px + env(safe-area-inset-bottom,0px));width:64px;height:64px;border-radius:50%;background:#fff;border:3px solid var(--ac);overflow:hidden;cursor:pointer;z-index:30;box-shadow:0 6px 18px #0005;padding:0;animation:fl 3s ease-in-out infinite}.rip img{width:100%;height:100%;object-fit:cover}@keyframes fl{50%{transform:translateY(-5px)}}
.riplbl{position:fixed;right:18px;bottom:calc(8px + env(safe-area-inset-bottom,0px));width:64px;text-align:center;font-size:12px;font-weight:700;color:var(--ac);z-index:30}
.chat{position:fixed;right:18px;bottom:calc(108px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100vw - 36px));height:min(460px,60vh);background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:0 10px 30px #0005;display:none;flex-direction:column;z-index:30;overflow:hidden}
.ch{display:flex;gap:10px;align-items:center;padding:10px;border-bottom:1px solid var(--bd)}.ch img,.msg img{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#fff;flex:none}
#msgs{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:10px}.msg{display:flex;gap:8px;max-width:92%}.msg.me{align-self:flex-end}.bub{background:var(--ac2);border-radius:12px;padding:8px 10px}.me .bub{background:var(--ac);color:#fff}
.chip{border:1px solid var(--ac);background:transparent;color:var(--ac);border-radius:99px;padding:3px 10px;margin:6px 6px 0 0;cursor:pointer;font-size:13px}.ci{display:flex;gap:6px;padding:8px;border-top:1px solid var(--bd)}
</style>
</head>
<body>
<header><div class="logo">🪦 Project Graveyard</div><nav id="nav"></nav></header>
<main id="app"></main>
<button class="rip" onclick="toggleChat()" aria-label="Ripper assistant"><img class="rimg" alt="Ripper"></button><span class="riplbl">Ripper</span>
<div class="chat" id="chat"><div class="ch"><img class="rimg" alt=""><div><b>Ripper</b><div class="mu">Your project guide</div></div><button class="btn o s" style="margin-left:auto" onclick="toggleChat()">✕</button></div><div id="msgs"></div><div class="ci"><input id="ci" placeholder="Ask Ripper…" onkeydown="if(event.key==='Enter'){ask(this.value);this.value=''}"><button class="btn s" onclick="ask($('#ci').value);$('#ci').value=''">Send</button></div></div>
<script>
const $=s=>document.querySelector(s);
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DEPTS=['Computer Science','Electronics & Communication','Electrical','Mechanical','Civil','Information Technology','Chemical'];
const SEMS=[1,2,3,4,5,6,7,8];
const uid0=(R,id)=>R.users.find(u=>u.id===id);
function seed(){
 const u=(id,name,email,role,dept,sem,pts,cr)=>({id,name,email,role,dept,sem,pw:'demo',pts:0,cr:0});
 const p=(id,o,title,dept,sem,desc,tags,loc)=>({id,owner:o,title,dept,sem,desc,tags,loc,status:'verified',copies:0});
 const R={me:null,users:[
  u(1,'Arjun Menon','arjun@college.edu','senior','Computer Science',7,150,40),
  u(2,'Fathima Nasar','fathima@college.edu','senior','Electronics & Communication',6,100,20),
  u(3,'Rahul Das','rahul@college.edu','senior','Mechanical',8,50,0),
  u(4,'Admin Faculty','admin@college.edu','admin','Computer Science',0,0,0),u(5,'Meera Nair','meera@college.edu','senior','Civil',7,0,0),u(6,'Sanjay Pillai','sanjay@college.edu','senior','Electrical',8,0,0),u(7,'Anjali Raj','anjali@college.edu','senior','Information Technology',6,0,0),u(8,'Nikhil Varma','nikhil@college.edu','senior','Chemical',7,0,0)],
 projects:[
  p(1,1,'Campus Bus Tracker','Computer Science',7,'Live GPS tracking of college buses with arrival predictions and a student-facing app.',['React','Node.js','MQTT'],'CS Lab 2, Block A'),
  p(2,1,'Attendance via Face Recognition','Computer Science',6,'Classroom attendance marking using a webcam and a lightweight face-recognition model.',['Python','OpenCV'],'CS Lab 1, Block A'),
  p(3,2,'Smart Irrigation Controller','Electronics & Communication',6,'Soil-moisture sensing with automatic valve control and an SMS alert system.',['Arduino','GSM','Sensors'],'Electronics Lab, Block C'),
  p(4,3,'Solar-Powered Water Purifier','Mechanical',8,'Low-cost solar distillation unit with a tilted-basin design reaching high yield per day.',['Solar','Thermal','CAD'],'Workshop, Block D'),
  p(5,7,'Smart Parking System','Information Technology',6,'Sensors detect free slots and a web dashboard shows live availability and reservations.',['IoT','Flask','MySQL'],'IT Lab 3, Block B'),
  p(6,5,'Low-Cost Bridge Load Tester','Civil',7,'Scaled bridge model with strain gauges that plots stress as a load moves across.',['Strain gauge','Arduino'],'Structures Lab, Block E'),
  p(7,6,'Smart Energy Meter','Electrical',8,'Measures home power use in real time and shows usage trends and tariff estimates.',['ESP32','Dashboard'],'Power Lab, Block C'),
  p(8,8,'Biodiesel from Waste Cooking Oil','Chemical',7,'Lab-scale transesterification setup turning used oil into usable biodiesel.',['Catalyst','Lab-scale'],'Chem Lab, Block F'),
  p(9,1,'Study Buddy Chatbot','Computer Science',5,'A chatbot that answers syllabus questions from uploaded class notes.',['Python','NLP','Flask'],'CS Lab 2, Block A'),
  p(10,2,'Line-Following Robot','Electronics & Communication',4,'Beginner robot using IR sensors and PID tuning to follow tracks at speed.',['Arduino','IR','Motors'],'Robotics Club Room'),
  p(11,3,'3D-Printed Prosthetic Hand','Mechanical',7,'Low-cost printed hand with tendon-driven fingers and a servo grip.',['CAD','3D printing'],'Workshop, Block D'),
  p(12,5,'Rainwater Harvesting Planner','Civil',6,'Spreadsheet and map tool that sizes tanks and recharge pits for campus roofs.',['GIS','Excel'],'Survey Lab, Block E')],
 copies:[],tickets:[],nid:100};R.projects.forEach((x,i)=>{x.copies=[14,9,11,6,12,5,8,7,10,4,9,6][i];x.visits=[22,15,18,9,20,8,12,11,16,6,13,9][i];x.likes=x.copies*2+3;uid0(R,x.owner).pts+=50+x.copies*20+x.visits*10});return R;
}
let S;try{S=JSON.parse(localStorage.getItem('pg_v2'))}catch(e){}if(!S)S=seed();
const save=()=>{try{localStorage.setItem('pg_v2',JSON.stringify(S))}catch(e){}};
const me=()=>S.users.find(u=>u.id===S.me);
const uid=id=>S.users.find(u=>u.id===id);
let view='home',F={q:'',d:'',s:''},authMode='login';

function nav(){
 const m=me(),n=$('#nav');
 if(!m){n.innerHTML='';return}
 const t=(v,l)=>`<button class="btn o s ${view===v?'on':''}" onclick="go('${v}')">${l}</button>`;
 n.innerHTML=(m.role==='senior'?'<span class="tag" style="align-self:center">⭐ '+m.pts+' pts</span>':'')+t('home','Browse')+(m.role==='senior'?t('upload','Upload'):'')+(m.role==='admin'?t('verify','Verify ('+S.projects.filter(p=>p.status==='pending').length+')'):'')+t('mine','My Account')+`<button class="btn o s" onclick="logout()">Log out</button>`;
}
function go(v){view=v;render()}
function logout(){S.me=null;save();view='home';render()}
function render(){nav();const m=me();$('#app').innerHTML=!m?authView():({home:homeView,upload:uploadView,verify:verifyView,mine:mineView}[view]||homeView)();}

function authView(){
 const reg=authMode==='register';
 return`<div class="card auth"><h2>${reg?'Create account':'Welcome back'}</h2>
 ${reg?`<label>Full name</label><input id="n">`:''}
 <label>College email</label><input id="e" type="email">
 <label>Password</label><input id="p" type="password">
 ${reg?`<label>I am a</label><select id="r" onchange="$('#ex').style.display=this.value==='admin'?'none':'block'"><option value="junior">Junior (browse and copy projects)</option><option value="senior">Senior (upload projects)</option><option value="admin">Faculty verifier</option></select>
 <div id="ex"><label>Department</label><select id="d">${DEPTS.map(d=>`<option>${d}</option>`).join('')}</select><label>Semester</label><select id="s">${SEMS.map(s=>`<option>${s}</option>`).join('')}</select></div>`:''}
 <div class="row"><button class="btn" onclick="${reg?'doReg()':'doLogin()'}">${reg?'Sign up':'Log in'}</button><button class="btn o" onclick="authMode='${reg?'login':'register'}';render()">${reg?'I have an account':'Create account'}</button></div>
 ${reg?'':`<p class="mu">Demo logins (password <b>demo</b>): arjun@college.edu (senior), admin@college.edu (verifier). Or sign up as a junior.</p>`}
 <p id="err" class="wn"></p></div>`;
}
function doLogin(){const u=S.users.find(x=>x.email===$('#e').value.trim().toLowerCase()&&x.pw===$('#p').value);if(!u)return $('#err').textContent='Wrong email or password.';S.me=u.id;save();view='home';render()}
function doReg(){
 const n=$('#n').value.trim(),e=$('#e').value.trim().toLowerCase(),p=$('#p').value,r=$('#r').value;
 if(!n||!e||p.length<4)return $('#err').textContent='Fill in name, email and a password of 4+ characters.';
 if(S.users.some(x=>x.email===e))return $('#err').textContent='That email is already registered.';
 const u={id:S.nid++,name:n,email:e,pw:p,role:r,dept:r==='admin'?'Faculty':$('#d').value,sem:r==='admin'?0:+$('#s').value,pts:0,cr:0};
 S.users.push(u);S.me=u.id;save();view='home';render();
}

function homeView(){
 const m=me(),list=S.projects.filter(p=>p.status==='verified'&&(!F.d||p.dept===F.d)&&(!F.s||p.sem==F.s)&&(!F.q||(p.title+p.desc+p.tags.join(' ')).toLowerCase().includes(F.q.toLowerCase())));
 list.sort((a,b)=>a.dept.localeCompare(b.dept)||a.sem-b.sem);
 let h=`<h2>Projects by seniors</h2><p class="mu">Hi ${E(m.name)}. Browse verified work, copy one to build your own version, and book a visit ticket to see it in person.</p>
 ${schemeHTML()}<div class="bar"><input placeholder="Search projects…" value="${E(F.q)}" oninput="F.q=this.value;renderGrid()">
 <select onchange="F.d=this.value;renderGrid()"><option value="">All departments</option>${DEPTS.map(d=>`<option ${F.d===d?'selected':''}>${d}</option>`).join('')}</select>
 <select onchange="F.s=this.value;renderGrid()"><option value="">All semesters</option>${SEMS.map(s=>`<option value="${s}" ${F.s==s?'selected':''}>Semester ${s}</option>`).join('')}</select><select onchange="F.o=this.value;renderGrid()"><option value="">Group by department</option><option value="c" ${F.o==='c'?'selected':''}>Most copied</option><option value="v" ${F.o==='v'?'selected':''}>Most visited</option></select></div><div id="g"></div>`;
 setTimeout(renderGrid);return h;
}
function renderGrid(){
 const list=S.projects.filter(p=>p.status==='verified'&&(!F.d||p.dept===F.d)&&(!F.s||p.sem==F.s)&&(!F.q||(p.title+p.desc+p.tags.join(' ')).toLowerCase().includes(F.q.toLowerCase())));
 list.sort((a,b)=>a.dept.localeCompare(b.dept)||a.sem-b.sem);
 const g=$('#g');if(!g)return;
 if(!list.length){g.innerHTML='<div class="card mu">No projects match these filters.</div>';return}
 if(F.o==='c')list.sort((a,b)=>b.copies-a.copies);if(F.o==='v')list.sort((a,b)=>(b.visits||0)-(a.visits||0));let out='',cur='';
 for(const p of list){
  const hd=F.o?'Ranked':p.dept;if(hd!==cur){if(cur)out+='</div>';cur=hd;out+=`<h3 style="margin:18px 0 8px">${E(cur)}</h3><div class="grid">`}
  const o=uid(p.owner);
  out+=`<div class="card hov" onclick="detail(${p.id})"><span class="mu">Semester ${p.sem} · <span class="ok">✔ Verified</span></span><h3>${E(p.title)}</h3><p style="margin:6px 0">${E(p.desc)}</p>
  <div>${p.tags.map(t=>`<span class="tag">${E(t)}</span>`).join('')}</div>
  <div class="who" style="cursor:pointer" onclick="event.stopPropagation();profile(${o.id})"><div class="av">${E(o.name[0])}</div><div><b>${E(o.name)}</b><div class="mu">${E(o.dept)} · Sem ${o.sem} · ⭐ ${o.pts}</div></div></div>
  <div class="row"><button class="btn s" onclick="event.stopPropagation();copyP(${p.id})">Copy &amp; remix</button><button class="btn o s" onclick="event.stopPropagation();ticket(${p.id})">Get visit ticket</button><span class="mu" style="align-self:center">${p.copies} copies · ${p.visits||0} visits</span></div></div>`;
 }
 g.innerHTML=out+'</div>';
}
function copyP(id){
 const m=me(),p=S.projects.find(x=>x.id===id);
 if(m.role==='senior'&&p.owner===m.id)return toast('This is your own project.');
 if(S.copies.some(c=>c.user===m.id&&c.proj===id))return toast('You already copied this one – see My Account.');
 S.copies.push({user:m.id,proj:id,title:p.title+' (my version)',note:''});
 p.copies++;uid(p.owner).pts+=PTS.copy;save();renderGrid();
 toast('Copied! Find it in My Account. The author earned 20 points.');
}
function ticket(id){
 const m=me(),p=S.projects.find(x=>x.id===id);
 let t=S.tickets.find(x=>x.user===m.id&&x.proj===id);
 if(!t){t={user:m.id,proj:id,code:'PV-'+(1000+Math.floor(Math.random()*9000))+'-'+p.id,date:new Date().toLocaleDateString()};S.tickets.push(t);if(p.owner!==m.id){p.visits=(p.visits||0)+1;uid(p.owner).pts+=PTS.visit}save()}
 showTicket(t);
}
function showTicket(t){
 const p=S.projects.find(x=>x.id===t.proj),m=uid(t.user),pat=[...t.code].map((c,i)=>(c.charCodeAt(0)*(i+3))%3?'':'z');
 let q='';for(let i=0;i<64;i++)q+=`<i class="${(t.code.charCodeAt(i%t.code.length)+i*7)%3?'':'z'}"></i>`;
 const d=document.createElement('div');d.className='modal';d.onclick=e=>{if(e.target===d)d.remove()};
 d.innerHTML=`<div class="card"><h3>Physical project visit ticket</h3><div class="ticket"><div class="qr">${q}</div><div><div class="code">${t.code}</div><b>${E(p.title)}</b><div class="mu">${E(p.loc)} · issued ${t.date}</div><div class="mu">Holder: ${E(m.name)}</div></div></div><p class="mu">Show this ticket at the venue. Visit during college hours; the senior or lab in-charge will demo the project.</p><div class="row"><button class="btn" onclick="window.print()">Print</button><button class="btn o" onclick="this.closest('.modal').remove()">Close</button></div></div>`;
 document.body.appendChild(d);
}
function toast(msg){const d=document.createElement('div');d.className='modal';d.onclick=()=>d.remove();d.innerHTML=`<div class="card" style="max-width:360px"><p>${E(msg)}</p><button class="btn">OK</button></div>`;document.body.appendChild(d)}

function uploadView(){
 const m=me();
 return`<h2>Upload a project</h2><div class="card" style="max-width:600px"><p class="mu">Uploading as <b>${E(m.name)}</b> · ${E(m.dept)}, Semester ${m.sem}. A faculty member verifies it before it goes live; you earn <b>50 points</b> once approved.</p>
 <label class="mu">Title</label><input id="t"><label class="mu">Description</label><textarea id="ds" rows="4"></textarea>
 <label class="mu">Tags (comma separated)</label><input id="tg" placeholder="Python, Arduino">
 <label class="mu">Where can juniors see the physical project?</label><input id="lc" placeholder="Lab / block / room">
 <label class="mu">Semester when you built it</label><select id="sm">${SEMS.map(s=>`<option ${s==m.sem?'selected':''}>${s}</option>`).join('')}</select>
 <div class="row"><button class="btn" onclick="doUpload()">Submit for verification</button></div></div>`;
}
function doUpload(){
 const m=me(),t=$('#t').value.trim(),ds=$('#ds').value.trim();
 if(!t||!ds)return toast('Please add a title and description.');
 S.projects.push({id:S.nid++,owner:m.id,title:t,dept:m.dept,sem:+$('#sm').value,desc:ds,tags:$('#tg').value.split(',').map(x=>x.trim()).filter(Boolean),loc:$('#lc').value.trim()||'Ask department office',status:'pending',copies:0});
 save();toast('Submitted! It will appear after verification.');go('mine');
}
function verifyView(){
 const l=S.projects.filter(p=>p.status==='pending');
 return`<h2>Pending verification</h2>`+(l.length?l.map(p=>{const o=uid(p.owner);return`<div class="card" style="margin-bottom:12px"><h3>${E(p.title)}</h3><p>${E(p.desc)}</p><div class="mu">${E(o.name)} · ${E(p.dept)} · Sem ${p.sem} · Venue: ${E(p.loc)}</div><div class="row"><button class="btn s" onclick="vf(${p.id},1)">Approve</button><button class="btn o s" onclick="vf(${p.id},0)">Reject</button></div></div>`}).join(''):'<div class="card mu">Nothing waiting. All caught up.</div>');
}
function vf(id,ok){const p=S.projects.find(x=>x.id===id);if(ok){p.status='verified';uid(p.owner).pts+=PTS.up}else p.status='rejected';save();render()}
function mineView(){
 const m=me();let h=`<h2>${E(m.name)}</h2><p class="mu">${E(m.role[0].toUpperCase()+m.role.slice(1))}${m.role!=='admin'?' · '+E(m.dept)+' · Semester '+m.sem:''}</p>`;
 if(m.role==='senior'){
  const mine=S.projects.filter(p=>p.owner===m.id);
  h+=`${statsHTML(m)}<h3>My uploads</h3>`+mine.map(p=>`<div class="card" style="margin:8px 0"><b>${E(p.title)}</b> <span class="${p.status==='verified'?'ok':'wn'}">${p.status}</span><div class="mu">${p.copies} juniors copied this</div></div>`).join('');
  const lb=S.users.filter(u=>u.role==='senior').sort((a,b)=>(b.pts+b.cr)-(a.pts+a.cr));
  h+=`<h3 style="margin-top:20px">Leaderboard</h3>`+lb.map((u,i)=>`<div class="card hov" style="margin:6px 0" onclick="profile(${u.id})">#${i+1} ${E(u.name)} <span class="mu">· ${u.pts} pts · ${title(u.pts)}</span></div>`).join('');
 }
 if(m.role==='junior'){
  const c=S.copies.filter(x=>x.user===m.id),t=S.tickets.filter(x=>x.user===m.id);

const title=p=>p>=600?'Grim Legend':p>=300?'Reaper':p>=100?'Grave Digger':'Rookie';
const rank=m=>S.users.filter(u=>u.role==='senior').sort((a,b)=>b.pts-a.pts).findIndex(u=>u.id===m.id)+1;
const sums=m=>{const l=S.projects.filter(p=>p.owner===m.id&&p.status==='verified');return{n:l.length,c:l.reduce((a,p)=>a+p.copies,0),v:l.reduce((a,p)=>a+(p.visits||0),0)}};
function schemeHTML(){return`<div class="card" style="margin-bottom:14px"><b>How scoring works</b><div class="row" style="margin-top:6px"><span class="tag">⬆ Verified upload +50</span><span class="tag">👣 Someone visits your project +10</span><span class="tag">📋 Someone copies it +20</span></div><div class="mu">Titles: Rookie → Grave Digger (100) → Reaper (300) → Grim Legend (600)</div></div>`}
function statsHTML(m){const s=sums(m);return`<div class="stats"><div class="card"><b>${m.pts}</b>Score · ${title(m.pts)}</div><div class="card"><b>#${rank(m)}</b>Rank</div><div class="card"><b>${s.n}</b>Projects (+${s.n*PTS.up})</div><div class="card"><b>${s.c}</b>Copies (+${s.c*PTS.copy})</div><div class="card"><b>${s.v}</b>Visits (+${s.v*PTS.visit})</div></div><div class="row" style="margin:-4px 0 14px"><button class="btn s" onclick="shareProfile(${m.id})">Share my profile</button><button class="btn o s" onclick="profile(${m.id})">Preview public profile</button></div>`}
function shareProfile(id){const u=uid(id),text=u.name+' has '+u.pts+' points on Project Graveyard ('+title(u.pts)+')',url=ART+'#u'+id;
 if(navigator.share)navigator.share({title:'Project Graveyard',text,url}).catch(()=>{});else{try{navigator.clipboard.writeText(text+' '+url).then(()=>toast('Profile link copied!')).catch(()=>toast(url))}catch(e){toast(url)}}}
function modal(h){const d=document.createElement('div');d.className='modal';d.onclick=e=>{if(e.target===d)d.remove()};d.innerHTML=h;document.body.appendChild(d)}
function profile(id){const u=uid(id);if(!u)return;const l=S.projects.filter(p=>p.owner===id&&p.status==='verified'),s=sums(u);
 modal(`<div class="card" style="text-align:center"><div class="av" style="width:64px;height:64px;font-size:28px;margin:0 auto 8px">${E(u.name[0])}</div><h2 style="margin:0">${E(u.name)}</h2><div class="mu">${E(u.dept)} · Semester ${u.sem}</div><div style="margin:12px 0"><span class="code" style="font-size:34px">${u.pts}</span><div class="mu">points · ${title(u.pts)}${u.role==='senior'?' · Rank #'+rank(u):''}</div></div><div class="mu">${s.n} projects · ${s.c} copies · ${s.v} visits</div><div style="text-align:left;margin-top:10px">${l.map(p=>`<span class="tag">${E(p.title)}</span>`).join('')}</div><div class="row" style="justify-content:center"><button class="btn s" onclick="shareProfile(${id})">Share</button><button class="btn o s" onclick="this.closest('.modal').remove()">Close</button></div></div>`)}
function detail(id){const p=S.projects.find(x=>x.id===id),o=uid(p.owner);
 modal(`<div class="card"><span class="mu">${E(p.dept)} · Semester ${p.sem}</span><h2 style="margin:4px 0 8px">${E(p.title)}</h2><p>${E(p.desc)}</p><div>${p.tags.map(t=>`<span class="tag">${E(t)}</span>`).join('')}</div><p class="mu">📍 ${E(p.loc)} · ${p.copies} copies · ${p.visits||0} visits</p><div class="who" style="cursor:pointer" onclick="this.closest('.modal').remove();profile(${o.id})"><div class="av">${E(o.name[0])}</div><div><b>${E(o.name)}</b><div class="mu">${E(o.dept)} · Sem ${o.sem} · ⭐ ${o.pts}</div></div></div><div class="row"><button class="btn s" onclick="copyP(${p.id})">Copy &amp; remix</button><button class="btn o s" onclick="ticket(${p.id})">Get visit ticket</button><button class="btn o s" onclick="like(${p.id},this)">💀 ${(p.likes||0)+(p.lk||[]).length}</button><button class="btn o s" onclick="this.closest('.modal').remove()">Close</button></div></div>`)}
function like(id,b){const p=S.projects.find(x=>x.id===id),m=me();p.lk=p.lk||[];const i=p.lk.indexOf(m.id);i<0?p.lk.push(m.id):p.lk.splice(i,1);save();b.textContent='💀 '+((p.likes||0)+p.lk.length)}
let chatOpen=false;
function toggleChat(){chatOpen=!chatOpen;$('#chat').style.display=chatOpen?'flex':'none';if(chatOpen&&!$('#msgs').children.length)say('Boo! I’m <b>Ripper</b>, your project guide. Ask me about points, tickets or copying, or tell me what you want to build.',['How do points work?','Suggest a project','What is a visit ticket?'])}
function say(h,chips=[]){const b=document.createElement('div');b.className='msg';b.innerHTML=`<img src="${RIP}" alt=""><div><div class="bub">${h}</div>${chips.map(c=>typeof c==='string'?`<button class="chip" onclick="ask(this.textContent)">${E(c)}</button>`:`<button class="chip" onclick="detail(${c.id})">${E(c.title)}</button>`).join('')}</div>`;$('#msgs').appendChild(b);$('#msgs').scrollTop=1e5}
function ask(q){if(!q.trim())return;const u=document.createElement('div');u.className='msg me';u.innerHTML=`<div class="bub">${E(q)}</div>`;$('#msgs').appendChild(u);$('#msgs').scrollTop=1e5;setTimeout(()=>reply(q.toLowerCase()),350)}
function reply(q){
 const V=S.projects.filter(p=>p.status==='verified');
 if(/point|score|reward|rank/.test(q))return say('Verified upload: <b>+50</b>. Someone books a visit ticket: <b>+10</b>. Someone copies your project: <b>+20</b>. Titles: Grave Digger at 100, Reaper at 300, Grim Legend at 600.',['How do I upload?','Show top projects']);
 if(/ticket|visit/.test(q))return say('Tap <b>Get visit ticket</b> on any project. You get a code to show at the venue, and the senior earns 10 points.');
 if(/upload|submit|post/.test(q))return say('Log in as a senior, open <b>Upload</b>, fill in the details and submit. A faculty member verifies it, then you get 50 points.');
 if(/copy|remix|fork/.test(q))return say('Press <b>Copy &amp; remix</b> on a project. It lands in My Account as your own version, and the author earns 20 points.');
 if(/share|profile/.test(q))return say('Open <b>My Account</b> and tap <b>Share my profile</b> to send your score card to others.');
 const top=()=>[...V].sort((a,b)=>b.copies-a.copies).slice(0,3);
 if(/top|popular|best/.test(q))return say('Most copied right now:',top());
 const w=q.replace(/[^a-z0-9 ]/g,'').split(' ').filter(x=>x.length>2&&!/suggest|project|idea|want|build|something|make|for|the|with|about|any|some/.test(x));
 if(!w.length)return say('Here are some popular ones to start with:',top());
 const l=V.map(p=>({p,s:w.filter(x=>(p.title+p.desc+p.tags.join(' ')+p.dept).toLowerCase().includes(x)).length})).filter(x=>x.s).sort((a,b)=>b.s-a.s).slice(0,3).map(x=>x.p);
 if(l.length)return say('Try these:',l);
 say('No match for that. Try a topic like “IoT”, “robot” or “solar”, or ask about points and tickets.',['Show top projects','How do points work?']);
}
document.querySelectorAll('.rimg').forEach(i=>i.src=RIP);
render();if(/^#u\d+$/.test(location.hash))profile(+location.hash.slice(2));
</script>
